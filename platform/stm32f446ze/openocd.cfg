# NUCLEO-F446ZE 板级 OpenOCD 配置
# ---------------------------------------------------------------------------
# 本文件只回答两个问题：
#   1. 这块板上挂的是什么调试器 —— 板载 ST-Link/V2-1，SWD 两线
#   2. 目标芯片是什么 —— STM32F446ZE，Cortex-M4F，512 KB Flash / 128 KB SRAM
#
# 实验不直接引用本文件，也不需要知道调试器品牌：
#   实验的 CMakeLists.txt 只调用 stm32f446ze_add_flash_target(<target>)，
#   命令行由本目录的 CMakeLists.txt 拼装。
#
# 手工调试：
#   openocd -f platform/stm32f446ze/openocd.cfg
#   arm-none-eabi-gdb build/debug/experiments/001_gpio_output/exp001_gpio_output.elf
#   (gdb) target extended-remote :3333
# ---------------------------------------------------------------------------

# 板载调试器。
#   注意：本 OpenOCD 版本的 interface/stlink.cfg 用的是 `adapter driver st-link`
#   （dapdirect 模型），只接受 jtag / swd / swim 三种 transport，
#   旧版的 hla_swd 在这里会报 "Debug adapter doesn't support 'hla_swd' transport"。
#   interface/stlink-dap.cfg 与 transport select dapdirect_swd 均已 deprecated，
#   stlink-dap.cfg 只是转发到 stlink.cfg，不要再切过去。
#   调试器品牌与传输方式只在本文件出现，实验侧无感：
#   要换调试器/换协议只改这里，flash.sh 和 experiments/ 都不用动。
source [find interface/stlink.cfg]

# 传输方式必须显式给出。删掉本行 openocd 会自动兜底选 "swd (dapdirect)"，
# 能烧通但每次都打印 DEPRECATED 警告，且该自动选择行为本身将被移除。
# 实测 `transport select swd` 无任何警告，是官方指定的正确写法。
transport select swd

# 目标芯片：STM32F446ZE，SWD 接口
#   本文件会 source target/swj-dp.tcl，其中 [catch {transport select}] 要求
#   transport 必须已有值 —— 这是上面那行不能删的真正原因。
source [find target/stm32f4x.cfg]

# 连接时先拉低 SRST，examine 完成后再释放。
#
# 为什么需要：003/004 的主循环是 __WFI()，CPU 会睡眠。stm32f4x.cfg 里的
# DBGMCU_CR.DBG_SLEEP 是在 examine-end 事件里才置位的；如果目标已经在
# sleep 中，examine 本身就会因为 AHB-AP 访问不到睡眠中的核心而失败
# （现象：DPIDR 能读、随后 "Examination failed" / "reset will not halt"）。
# connect_assert_srst 让 OpenOCD 在 examine 期间保持硬件复位，绕开这个
# 先有鸡还是先有蛋的问题；NUCLEO 板载 ST-LINK 的 NRST 已接到目标 SRST。
reset_config srst_only srst_nogate connect_assert_srst

# 等价写法（用上游板级文件代替上面的 interface / target 两处 source）：
#   source [find board/st_nucleo_f4.cfg]
